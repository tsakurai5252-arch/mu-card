<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>賞品交換ショップ</title>
  <style>
    :root {
      --primary: #1a365d;
      --secondary: #2b6cb0;
      --bg: #f7fafc;
      --card-bg: #ffffff;
      --text: #2d3748;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: var(--primary); margin-bottom: 5px; }

    /* 商品カード一覧 */
    .item-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .item-card {
      background: var(--card-bg); padding: 20px; border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .item-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .item-price { font-size: 22px; color: var(--secondary); font-weight: bold; margin-bottom: 15px; }

    .btn-buy {
      width: 100%; background: var(--secondary); color: white; padding: 12px;
      border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      font-size: 15px; transition: opacity 0.2s;
    }
    .btn-buy:hover { opacity: 0.9; }
  </style>

  <!-- 共通ヘッダー読み込み -->
  <script src="menu.js"></script>
</head>
<body>

  <!-- 共通ヘッダー挿入エリア -->
  <div id="common-menu-area">
    <menu-text>000000</menu-text>
  </div>

  <div class="container">
    <header>
      <h1>賞品引き換えショップ</h1>
      <p>お好きな賞品をお選びください</p>
    </header>

    <div class="item-grid">
      <!-- 商品1: 寄付 -->
      <div class="item-card">
        <div>
          <div class="item-title">運営に寄付</div>
          <div class="item-price">1pt～</div>
        </div>
        <button class="btn-buy" onclick="location.href='point-k.html'">ポイント交換する</button>
      </div>

      <!-- 商品2: プレミアム会員券（ゴールド昇格対象） -->
      <div class="item-card">
        <div>
          <div class="item-title">プレミアム会員券</div>
          <div class="item-price">5,980pt</div>
        </div>
        <button class="btn-buy" onclick="goToCredit(5980, 'プレミアム会員券', 'premium_pass')">ポイント交換する</button>
      </div>

      <!-- 商品3（非表示・コメントアウト中） -->
      <!--
      <div class="item-card">
        <div>
          <div class="item-title">プレミアム会員権 (1ヶ月)</div>
          <div class="item-price">3,000pt</div>
        </div>
        <button class="btn-buy" onclick="goToCredit(3000, 'プレミアム会員権 (1ヶ月)', 'pass_1month')">ポイント交換する</button>
      </div>
      -->
    </div>
  </div>

  <script>
    // 値段・商品名・商品IDをURLパラメータとして決済画面へ引き渡す関数
    function goToCredit(price, itemName, itemId) {
      const encodedItem = encodeURIComponent(itemName || '');
      window.location.href = `mucredit.html?price=${price}&item=${encodedItem}&id=${itemId || ''}`;
    }
  </script>
</body>
</html>
